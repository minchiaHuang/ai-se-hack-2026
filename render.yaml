# Render Blueprint: the live site for the hackathon submission.
#
# Connect this repo once at https://dashboard.render.com/blueprints and Render
# reads this file. Supply the ElevenLabs values in the dashboard.
#
# The two ElevenLabs values are declared but not set here: "sync: false" means
# Render asks for values during initial Blueprint creation. Existing services
# ignore these declarations on update: add both values under Environment and
# save with a redeploy. No key is committed to this public repo.
#
# The trade-off, decided deliberately: /api/speak and the agent's talk link are
# public endpoints, so anyone who finds them can spend the ElevenLabs
# allowance. The key is due to be deleted after the demo, and deleting it takes
# the spoken questions with it. The pages then say so rather than break.
#
# ANTHROPIC_API_KEY stays unset: mapping and translation run their offline
# paths, and the demo flow uses fixtures.
services:
  - type: web
    name: bridgework
    runtime: python
    plan: free
    branch: main
    # Standard library only, so there is nothing to install. Render's Python
    # runtime insists on a build command, so this one just records the version.
    buildCommand: python3 --version
    startCommand: python3 skeleton/app.py
    healthCheckPath: /
    envVars:
      # Without this Python buffers stdout and the logs stay empty until it dies.
      - key: PYTHONUNBUFFERED
        value: "1"
      # Reads the questions aloud. Value goes in the Render dashboard.
      - key: ELEVENLABS_API_KEY
        sync: false
      # The AI interviewer the jobseeker calls from their own phone.
      - key: ELEVENLABS_AGENT_ID
        sync: false
