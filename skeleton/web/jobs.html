<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matched jobs - Bridge Work</title>
<link rel="stylesheet" href="/resume-template.css">
<script src="/resume-template.js"></script>
<style>
/* Figma "Matched Jobs": the matched roles on the left, "why this matched" for
   the selected one on the right. Everything else is inline so the page renders
   offline from the stdlib server. */
:root {
  /* BridgeWork theme from the Figma "Design Theme" frame, the same tokens as
     review.html. --ink is Figma's --text. */
  --primary: #1B4B5A;
  --accent: #E8874A;
  --success: #4C9A6B;
  --bg: #F7F5F1;
  --ink: #2B2B2B;
  --card: #fff;
  --muted: #5b6168;
  --line: #d9d4cb;
  --pill: #efebe4;
  /* Figma's evidenced and missing tints. Text on them is darkened past the
     tint's own hue: --success itself is too light for text (3.1:1). */
  --ok: #2f6b47;
  --ok-bg: #d9f2e1;
  --miss: #8a3f12;
  --miss-bg: #fde4d4;
  --gate: #3b1f7a;
  --gate-bg: #efe9fb;
  --focus: #ffbf00;
  /* Dark text on the accent: white on it fails contrast. */
  --on-fill: #1f1a15;
}
* { box-sizing: border-box; }
html { font-size: 17px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 1rem/1.45 Inter, system-ui, sans-serif;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
p { margin: .3rem 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
button.link { padding: 0; border: 0; background: none; color: var(--primary); font-weight: 700; cursor: pointer; }
button.link:hover { text-decoration: underline; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Figma header: white bar, logo icon, "Bridge" bold and "Work" regular. */
header.top { display: flex; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--card); }
.wordmark { display: flex; align-items: center; font-size: 1.6rem; letter-spacing: -.01em; color: inherit; text-decoration: none; }
.wordmark img { height: 1.6em; width: auto; margin-right: .45rem; }
.wordmark b { color: var(--ink); }
.wordmark span { color: var(--primary); font-weight: 400; margin-left: .15em; }
main { max-width: 1240px; margin: 0 auto; padding: 22px 24px 48px; }
.banner { margin: 0 0 14px; padding: .5rem .8rem; border: 2px dashed #9ca3af; border-radius: 8px; background: var(--card); }

/* ------------------------------------------------------------ heading */
.heading { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem 2rem; margin-bottom: 18px; }
.heading > div { flex: 1 1 420px; }
.heading h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; color: #111; }
.heading p { margin: .25rem 0 0; color: var(--muted); font-size: .9rem; }
.search { display: flex; align-items: center; width: 300px; max-width: 100%; min-height: 44px; padding: 0 1rem;
          border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.search:focus-within { outline: 4px solid var(--focus); outline-offset: 2px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; }

.board { display: grid; grid-template-columns: minmax(0, 690px) minmax(0, 1fr); gap: 24px; align-items: start; }

/* ------------------------------------------------------------ job cards (Figma "Job Card") */
.jobs { display: flex; flex-direction: column; gap: 16px; }
.job-card { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 1.1rem; align-items: start;
            padding: 20px 22px; border: 2px solid transparent; border-radius: 12px; background: var(--card);
            box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.job-card:hover { box-shadow: 0 0 0 1px var(--line), 0 4px 14px rgba(17, 24, 39, .08); }
.job-card.selected { border-color: var(--primary); box-shadow: none; }
.initials { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 10px; background: #f0efec;
            color: var(--primary); font-weight: 700; font-size: 1.15rem; }
.job-card h3 { margin: 0; font-size: 1.2rem; font-weight: 600; line-height: 1.25; }
.job-card h3 button { padding: 0; border: 0; background: none; font: inherit; text-align: left; cursor: pointer; }
.company { margin: .15rem 0 0; font-size: .95rem; }
.meta { margin: .1rem 0 0; color: var(--muted); font-size: .88rem; }
/* SEEK's search summary: two lines of the ad, the rest is in the panel. */
.snippet { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
           margin: .5rem 0 .6rem; color: var(--muted); font-size: .88rem; }
.pills { display: flex; flex-wrap: wrap; gap: .45rem; }
.pill { padding: .1rem .55rem; border-radius: 4px; font-size: .84rem; font-weight: 500; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.miss { background: var(--miss-bg); color: var(--miss); }
.pill.plain { background: var(--pill); color: var(--muted); }
.pill.done { background: var(--success); color: var(--on-fill); font-weight: 700; }

.list-foot { margin: 14px 0 0; }
.empty { color: var(--muted); font-style: italic; }

/* ------------------------------------------------------------ the right panel */
.panel { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; padding: 22px 24px;
         border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
.panel > h2 { margin: 0; font-size: 1.3rem; }
.panel .sub { margin: .2rem 0 .8rem; color: var(--muted); font-size: .9rem; }
.panel > h3 { margin: 1rem 0 .45rem; font-size: .92rem; color: var(--primary); }
.back { margin-bottom: .6rem; }
.skills { margin: 0; padding: 0; list-style: none; display: grid; gap: .3rem; }
.skills li { position: relative; padding-left: 1.5rem; }
.skills li::before { position: absolute; left: 0; font-weight: 700; }
.skills.ok li::before { content: "\2713"; color: var(--ok); }
.skills.miss li::before { content: "+"; color: var(--miss); }
.about { margin: 0; color: var(--muted); font-size: .92rem; }
.details { margin-top: 1.2rem; padding-top: .8rem; border-top: 1px solid var(--line); }
.details summary { cursor: pointer; color: var(--primary); font-weight: 700; font-size: .92rem; }
.details h4 { margin: 1rem 0 .4rem; font-size: .88rem; color: var(--primary); }
.units { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.unit { padding: .5rem .8rem; border-radius: 4px; font-size: .88rem; }
.unit.ok { background: var(--ok-bg); }
.unit.miss { background: var(--miss-bg); }
.unit .code { display: block; font-family: inherit; font-weight: 700; color: var(--primary); }
.unit .title { font-weight: 400; color: var(--muted); }
.unit q { display: block; margin-top: .1rem; color: var(--ink); }
.unit.miss p { margin: .1rem 0 0; color: var(--ink); }
.unit .basis { display: block; margin-top: .2rem; font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
.note { padding: .5rem .7rem; border-radius: 6px; background: var(--pill); font-size: .88rem; }
.apply { display: block; width: 100%; min-height: 46px; margin-top: .9rem; border: 0; border-radius: 6px;
         background: var(--accent); color: var(--on-fill); font-weight: 700; cursor: pointer; }
.apply:disabled { background: var(--success); cursor: default; }
button.secondary { min-height: 44px; padding: .3rem 1rem; border: 2px solid var(--primary); border-radius: 6px;
                   background: var(--card); color: var(--primary); font-weight: 700; cursor: pointer; }
.panel-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; margin-top: .8rem; }
/* "Jobs by Adzuna" is a licence requirement, not decoration: Adzuna's terms
   require the mark to link to the ad and to be drawn at no less than
   116x23 px. Do not shrink these two values or drop the link. */
.adzuna { display: inline-flex; align-items: center; min-width: 116px; min-height: 23px;
          color: var(--muted); font-size: .85rem; }
.status { margin-top: .6rem; font-weight: 600; }
.status:empty { display: none; }
a.link { color: var(--primary); font-weight: 700; }

/* Apply: the confirmed resume the application goes with. */
.resume-box { margin-top: .6rem; padding: 22px 24px; border: 1px solid var(--line); border-radius: 8px; }
.resume-box .rt { font-size: .82rem; }
.resume-box .rt-section { grid-template-columns: 7rem minmax(0, 1fr); column-gap: 1rem; }
.draft-text { margin: .6rem 0 0; padding: .6rem .7rem; border-radius: 8px; background: var(--pill); white-space: pre-wrap;
              overflow-wrap: anywhere; font: .8rem/1.4 ui-monospace, Menlo, Consolas, monospace; }
.buttons { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .8rem; }
.buttons .apply { width: auto; margin: 0; padding: 0 1.2rem; }

/* The full evidence pack, folded into the panel. */
.card { margin: .5rem 0; padding: .6rem .8rem; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); font-size: .9rem; }
.card h4 { margin: 0; font-size: .85rem; color: var(--muted); }
.card .value { margin: .1rem 0; font-size: 1.05rem; font-weight: 700; overflow-wrap: anywhere; }
.chip { display: inline-block; padding: 0 .5rem; border-radius: 999px; font-size: .78rem; font-weight: 700; }
.chip.high { background: var(--ok-bg); color: var(--ok); }
.chip.low { background: var(--miss-bg); color: var(--miss); }
.withheld { background: var(--miss-bg); box-shadow: none; }
.gate { margin: .8rem 0; padding: .7rem .9rem; border: 3px solid var(--gate); border-radius: 10px; background: var(--gate-bg); font-size: .9rem; }
.gate h4 { margin: 0 0 .3rem; color: var(--gate); font-size: 1rem; }
.gate a { overflow-wrap: anywhere; }

.nothing { max-width: 640px; margin: 3rem auto; padding: 1.2rem 1.4rem; border-radius: 14px; background: var(--card);
           box-shadow: 0 0 0 1px var(--line); }
.nothing a { color: var(--primary); font-weight: 700; }

@media (max-width: 1000px) {
  .board { grid-template-columns: 1fr; }
  .panel { position: static; max-height: none; }
}
@media (max-width: 560px) {
  .job-card { grid-template-columns: 44px minmax(0, 1fr); padding: 16px; }
  .initials { width: 44px; height: 44px; }
  .search { width: 100%; }
}

/* Printing gives the resume alone, only while it is open for an application:
   no coverage and no missing units, since the page may go to an employer. */
@media print {
  body { background: #fff; }
  body * { visibility: hidden; }
  .resume-box, .resume-box * { visibility: visible; }
  .resume-box { position: absolute; left: 0; top: 0; width: 100%; border: 0; }
}
</style>
</head>
<body>
<header class="top">
  <!-- A missing /logo.svg (or the page opened from disk) hides the image, so the wordmark alone still reads right. -->
  <a class="wordmark" id="home" href="/"><img src="/logo.svg" alt="" onerror="this.hidden = true"><b>Bridge</b><span>Work</span></a>
</header>
<main>
  <p id="mock-banner" class="banner" hidden>Mock mode: fixture data, no backend. Nothing is recorded or sent.</p>

  <section class="nothing" id="nothing" hidden aria-labelledby="h-nothing">
    <h2 id="h-nothing">Nothing to show yet</h2>
    <p>This page shows the jobs for a resume confirmed on the review page, in this browser tab. None has been confirmed here yet, or the tab was closed since.</p>
    <p><a id="nothing-link" href="/start/path">&larr; Build a resume to start</a></p>
  </section>

  <div id="board-view">
    <div class="heading">
      <div>
        <h1 id="title">Matched jobs</h1>
        <p id="summary"></p>
      </div>
      <label class="search"><span class="visually-hidden">Search roles or employers</span>
        <input type="search" id="job-search" placeholder="Search roles or employers" autocomplete="off"></label>
    </div>
    <div class="board">
      <section aria-labelledby="h-jobs">
        <h2 id="h-jobs" class="visually-hidden">Jobs</h2>
        <div class="jobs" id="jobs"></div>
        <p class="list-foot"><button type="button" class="link" id="show-all"></button></p>
      </section>
      <aside class="panel" id="panel" aria-label="Selected job"></aside>
    </div>
  </div>
</main>

<script>
"use strict";

// Written by review.html (or intake.html) just before it navigates here; read
// once on load. sessionStorage keeps it to this tab, gone when the tab closes.
const SESSION_KEY = "d7-session";
// What /start saved: only the name is read, for the heading.
const PERSON_KEY = "d7.person";
const params = new URLSearchParams(location.search);
// ?quiet=1 hides only the mock banner, for the recorded demo; nothing else changes.
const QUIET = params.get("quiet") === "1";
// Every link keeps the demo flags, so a quiet demo stays quiet. Opened from
// disk there is no route, so the links fall back to the files.
const FLAGS = [params.get("mock") === "1" && "mock=1", QUIET && "quiet=1"].filter(Boolean).join("&");
const asRoute = (route, file) => (location.protocol === "file:" ? file : route) + (FLAGS ? "?" + FLAGS : "");

const FIELD_LABELS = {
  anzsco_code: "ANZSCO 2022 occupation",
  osca_code: "OSCA 2024 occupation",
  units_evidenced: "Units of competency evidenced",
  qualification: "Qualification",
};

function readSession() {
  try {
    const session = JSON.parse(sessionStorage.getItem(SESSION_KEY));
    const ok = session && Array.isArray(session.lines) && session.extract && session.match &&
               Array.isArray(session.extract.suggestions) && (session.match.all_jobs || session.match.jobs);
    return ok ? session : null;
  } catch (err) {
    // Blocked storage or a damaged value reads as nothing built, never as a crash.
    return null;
  }
}

function personName() {
  try {
    const person = JSON.parse(sessionStorage.getItem(PERSON_KEY));
    return person && typeof person.name === "string" ? person.name.trim() : "";
  } catch (err) {
    return "";
  }
}

const session = readSession();
const state = {
  source: session ? session.source : null,   // "interview" or "resume"
  lines: session ? session.lines : [],
  extract: session ? session.extract : null,
  match: session ? session.match : null,
  name: (session && session.name) || personName(),
  selectedJob: null, // null means the first job listed
  q: "",
  showAll: false,    // false lists only the jobs with at least one unit evidenced
  panel: "why",      // "why" or "apply"
  applied: null,     // { id: ISO time }, see readApplied()
  via: session ? session.via || null : null, // "interview" or "upload", from /review only
};

const $ = id => document.getElementById(id);

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

const firstName = () => state.name.split(/\s+/)[0] || "";
const sourceWord = () => (state.source === "resume" ? "resume" : "interview");

// ---------------------------------------------------------------- evidence
// Units the pack evidences with a citation; withheld items never count.
function evidencedUnits(extract) {
  const units = [];
  for (const item of extract.suggestions) {
    if (item.field !== "units_evidenced") continue;
    for (const code of String(item.value).split(/[;,\s]+/).filter(Boolean)) {
      units.push({ code, sources: item.sources });
    }
  }
  return units;
}

// The English text a citation points at: "line=8" is a resume line, "t=02:41"
// (or a bare "02:41") a transcript line with its English gloss.
function citedText([label, locator]) {
  const key = String(locator).replace(/^(t|line)=/, "");
  const line = label === "resume" ? state.lines.find(l => String(l.line) === key)
                                  : state.lines.find(l => String(l.t) === key);
  return line ? line.en || line.text : "";
}

function citedWhere([label, locator]) {
  const key = String(locator).replace(/^(t|line)=/, "");
  return label === "resume" ? "resume line " + key : label === "transcript" ? "said at " + key : label + " " + locator;
}

// The heading over the evidenced units says where they came from, as Figma's
// "Evidenced by what Amina said": said in the interview, or written in a resume.
function evidencedHeading() {
  const who = firstName();
  if (state.via === "upload" || (!state.via && state.source === "resume")) {
    return who ? "Evidenced in " + who + "'s resume" : "Evidenced in the resume";
  }
  return "Evidenced by what " + (who || "the jobseeker") + " said";
}

function chip(confidence, withheld) {
  return el("span", { class: "chip " + (withheld ? "low" : "high") }, "confidence " + Number(confidence).toFixed(2));
}

function renderGate(gate, extract) {
  if (!gate) return null;
  const evidenced = evidencedUnits(extract).filter(unit => gate.text && gate.text.includes(unit.code));
  const kind = String(gate.kind || "").replace(/_/g, " ");
  return el("section", { class: "gate" },
    el("h4", {}, "Gate: what the law requires" + (kind ? " (" + kind + ")" : "")),
    el("p", {}, gate.text),
    evidenced.length ? el("p", {}, el("b", {}, "Already evidenced in this " + sourceWord() + ": "),
                          evidenced.map(unit => unit.code).join(", ")) : null,
    gate.refugee_note ? el("p", {}, el("b", {}, "Why it matters here: "), gate.refugee_note) : null,
    gate.source ? el("p", { class: "small" }, "Source: ", el("a", { href: gate.source, target: "_blank", rel: "noopener" }, gate.source)) : null);
}

function renderPack() {
  const extract = state.extract;
  const cited = sources => (sources || []).map(citedWhere).join(", ");
  const items = extract.suggestions.map(item =>
    el("div", { class: "card" },
      el("h4", {}, FIELD_LABELS[item.field] || item.field),
      el("p", { class: "value" }, item.value),
      el("p", {}, chip(item.confidence, false)),
      el("p", {}, item.reason),
      el("p", { class: "small muted" }, "From: " + cited(item.sources))));
  const withheld = (extract.needs_human || []).map(item =>
    el("div", { class: "card withheld" },
      el("h4", {}, FIELD_LABELS[item.field] || item.field),
      el("p", { class: "value" }, "Withheld: a person decides"),
      el("p", {}, chip(item.confidence, true), " too low to show a value"),
      el("p", {}, item.reason),
      el("p", { class: "small muted" }, "From: " + cited(item.sources))));
  const gaps = (extract.gaps || []).length ? el("div", { class: "card withheld" },
      el("h4", {}, "Not answered yet: ask about these"),
      el("ul", {}, extract.gaps.map(field => el("li", {}, FIELD_LABELS[field] || field)))) : null;
  return [items, withheld, gaps, renderGate(extract.gate, extract),
    el("p", { class: "small muted" }, extract.metric_name + ": " + extract.metric_value)];
}

// ---------------------------------------------------------------- jobs
// The whole board: every job, the occupation's first. A server older than
// "all_jobs" still gives a board of the occupation's jobs.
function boardJobs(match) {
  return match.all_jobs || match.jobs.map(job => Object.assign({ for_occupation: true }, job));
}

// The name the search reads and the card shows: the employer who placed the ad.
// The older sample board names a setting instead of an employer.
function employerLine(job) {
  return job.company || job.setting || "Employer not named in the ad";
}

// Figma's logo square: the employer's initials, since the ads carry no logo.
function initials(job) {
  const words = employerLine(job).replace(/[^\p{L}\p{N} ]/gu, " ").split(/\s+/).filter(Boolean);
  return (words.length > 1 ? words[0][0] + words[1][0] : (words[0] || "?").slice(0, 2)).toUpperCase();
}

// Where, what kind of work and, only when the employer stated it, the pay: a
// predicted salary is dropped when the snapshot is built.
function jobMeta(job) {
  return [job.location, job.contract_time || job.employment_type, job.salary].filter(Boolean).join("  ·  ");
}

// The jobs listed: by default those with at least one unit evidenced, in the
// server's order (the occupation's first, best evidenced first).
function listedJobs(match) {
  const q = state.q.trim().toLowerCase();
  return boardJobs(match).filter(job =>
    (state.showAll || job.matched.length > 0) &&
    (!q || (job.title + " " + employerLine(job)).toLowerCase().includes(q)));
}

function selectedJobId(listed) {
  const ids = listed.map(job => job.id);
  return ids.includes(state.selectedJob) ? state.selectedJob : (ids[0] || null);
}

function selectJob(id) {
  state.selectedJob = id;
  state.panel = "why";
  render();
  // The clicked title was replaced by the re-render; keep keyboard focus on its successor.
  const button = document.querySelector('.job-card[data-id="' + CSS.escape(id) + '"] h3 button');
  if (button) button.focus({ preventScroll: true });
}

function openPanel(which) {
  state.panel = which;
  render();
  $("panel").scrollTop = 0;
  const heading = $("h-panel");
  if (heading) heading.focus({ preventScroll: true });
}

// Unit coverage of this job: the share of the units it requires that the evidence
// covers, worked out from the server's lists so the percentage and the pills can
// never disagree. It describes the job, not the person.
//
// An ad that names no unit has no denominator. percent is null, never 0: a 0%
// would read as a verdict on the person when the ad asked for nothing we
// could count.
function coverage(job) {
  const required = job.matched.length + job.missing.length;
  return { evidenced: job.matched.length, required,
           percent: required ? Math.round(100 * job.matched.length / required) : null };
}

const NO_COVERAGE = {
  none_named: "Ad too short to name units",
  not_mapped: "Ad not mapped to units",
};

function noCoverageReason(job) {
  return NO_COVERAGE[job.units_status] || "No units to count";
}

// A required unit is either quoted from the ad itself or rests on the job
// title. The details say which in plain English, because a reader has to be
// able to see which units the employer actually wrote down. The older sample
// board carries no basis, so it says nothing.
const BASIS = {
  stated: "The ad says it needs this",
  title: "Jobs with this title normally need this",
};

function basisLine(unit) {
  const said = BASIS[unit.basis];
  if (!said) return null;
  return el("span", { class: "basis" }, said, unit.basis === "stated" && unit.quote ? ": “" + unit.quote + "”" : "");
}

// The one line a card and the panel give the fit: "75% skills match", the share
// of the units this job requires that the evidence covers. An ad with nothing
// to count says why instead of showing a 0% that would read as a verdict.
function matchPill(job) {
  const { percent } = coverage(job);
  if (percent === null) return el("span", { class: "pill plain" }, noCoverageReason(job));
  return el("span", { class: "pill " + (percent ? "ok" : "plain") }, percent + "% skills match");
}

function renderJobCard(job, selected) {
  const at = state.applied[job.id];
  return el("article", { class: "job-card" + (selected ? " selected" : ""), "data-id": job.id,
                         onclick: () => selectJob(job.id) },
    el("div", { class: "initials", "aria-hidden": "true" }, initials(job)),
    el("div", {},
      el("h3", {}, el("button", { type: "button", "aria-pressed": String(selected) }, job.title)),
      el("p", { class: "company" }, employerLine(job)),
      el("p", { class: "meta" }, jobMeta(job)),
      job.snippet ? el("p", { class: "snippet" }, job.snippet) : null,
      el("div", { class: "pills" }, matchPill(job),
         job.for_occupation ? null : el("span", { class: "pill plain" }, "Another occupation"),
         at ? el("span", { class: "pill done" }, "Applied") : null)));
}

// Adzuna's licence: every ad carries the mark, linking to that ad, drawn at no
// less than 116x23 px (see .adzuna in the stylesheet).
function adzunaLink(job) {
  const meta = state.match.jobs_source;
  const text = (meta && meta.attribution) || "Jobs by Adzuna";
  return job.redirect_url ? el("a", { class: "adzuna", href: job.redirect_url, target: "_blank", rel: "noopener" }, text) : null;
}

// Everything the caseworker may need to check, folded away so the job reads
// like a job ad: each unit's code, the line that evidences it and where the
// requirement comes from, then the full evidence pack.
function renderDetails(job) {
  const courses = Object.fromEntries((state.match.all_courses || state.match.courses || []).map(c => [c.code, c]));
  const unit = (u, evidenced) => {
    const quote = evidenced ? (u.sources || []).map(citedText).find(Boolean) : "";
    const course = courses[u.code];
    return el("li", { class: "unit " + (evidenced ? "ok" : "miss") },
      el("span", { class: "code" }, u.code, " ", el("span", { class: "title" }, u.title)),
      quote ? el("q", {}, quote) : null,
      !evidenced ? el("p", {}, "Nothing in this " + sourceWord() + " covers this one yet." +
                              (course ? " Gap training: " + course.qualification + "." : "")) : null,
      basisLine(u));
  };
  return el("details", { class: "details" },
    el("summary", {}, "Show evidence details"),
    job.matched.length ? [el("h4", {}, evidencedHeading()),
      el("ul", { class: "units" }, job.matched.map(u => unit(u, true)))] : null,
    job.missing.length ? [el("h4", {}, "Not evidenced yet"),
      el("ul", { class: "units" }, job.missing.map(u => unit(u, false))),
      el("p", { class: "small muted" }, "The caseworker decides whether to apply anyway.")] : null,
    el("h4", {}, "Evidence pack"),
    el("p", { class: "small muted" }, "Everything mapped from this " + sourceWord() + " to Australian occupations and units. " +
                                      "Shown to the jobseeker and caseworker only, never to an employer."),
    renderPack());
}

function renderWhy(job) {
  if (!job) {
    return [el("h2", { id: "h-panel", tabindex: "-1" }, "No job selected"),
            el("p", { class: "empty" }, "No role matches this search.")];
  }
  const at = state.applied[job.id];
  const noUnits = job.units_status && job.units_status !== "mapped";
  return [
    el("h2", { id: "h-panel", tabindex: "-1" }, job.title),
    el("p", { class: "company" }, employerLine(job)),
    el("p", { class: "sub" }, jobMeta(job)),
    el("button", { type: "button", class: "apply", disabled: Boolean(at), onclick: () => openPanel("apply") },
       at ? "Applied ✓ " + timeOf(at) : "Apply with this resume"),
    el("p", { class: "status small", id: "apply-status", role: "status", "aria-live": "polite" }),
    // The two empty cases are different facts and are never merged: one ad was
    // read and asked for nothing checkable, the other was never read at all.
    job.units_status === "none_named" ? el("p", { class: "note" },
      "This ad is too short to name the skills it needs, so there is nothing to match against.") : null,
    job.units_status === "not_mapped" ? el("p", { class: "note" },
      "This ad has not been matched against skills yet.") : null,
    job.matched.length ? [el("h3", {}, "Why " + (firstName() || "the jobseeker") + " is a match"),
      el("ul", { class: "skills ok" }, job.matched.map(u => el("li", {}, u.title)))] : null,
    job.missing.length ? [el("h3", {}, "Skills to build"),
      el("ul", { class: "skills miss" }, job.missing.map(u => el("li", {}, u.title)))] : null,
    job.snippet ? [el("h3", {}, "About the job"), el("p", { class: "about" }, job.snippet)] : null,
    el("div", { class: "panel-foot" },
      job.redirect_url ? el("a", { class: "link", href: job.redirect_url, target: "_blank", rel: "noopener" }, "View full ad ↗") : null,
      adzunaLink(job)),
    noUnits ? null : renderDetails(job)];
}

// ---------------------------------------------------------------- apply
// Nothing here is sent anywhere, in any mode: no network request, no email, no
// Adzuna call. Confirming an application only records the caseworker's
// confirmation in sessionStorage, this tab alone, so it survives a reload and
// is gone when the tab closes. A real application to an employer is out of
// scope (decided); the Adzuna link is how the ad is opened.
const APPLY_KEY = "d7-apply";

// The marks belong to the pack they were made on: a new resume in this tab
// starts a clean board, so one jobseeker's applications never show on another's.
function packStamp() {
  const raw = sessionStorage.getItem(SESSION_KEY) || "";
  let hash = 5381;
  for (let i = 0; i < raw.length; i++) hash = (hash * 33 + raw.charCodeAt(i)) | 0;
  return raw.length + ":" + hash;
}

function readApplied() {
  try {
    const stored = JSON.parse(sessionStorage.getItem(APPLY_KEY));
    return stored && stored.pack === packStamp() && stored.applied ? stored.applied : {};
  } catch (err) {
    // Blocked storage or a damaged value: start clean rather than crash the board.
    return {};
  }
}

function writeApplied() {
  try {
    sessionStorage.setItem(APPLY_KEY, JSON.stringify({ pack: packStamp(), applied: state.applied }));
  } catch (err) {
    // Storage full or blocked: the marks still hold until the tab reloads.
  }
}

function timeOf(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function confirmApply(job) {
  state.applied[job.id] = new Date().toISOString();
  writeApplied();
  openPanel("why");
  $("apply-status").textContent = "Application recorded at " + timeOf(state.applied[job.id]) + ". Nothing was sent.";
}

// The confirmation is a panel in the page, not a browser dialog: the job, the
// resume confirmed on the review page, who sends it, and what this demo does not do.
function renderApply(job) {
  const resume = state.match.resumes ? state.match.resumes[job.id] : null;
  const sections = session.sections;
  return [
    el("p", { class: "back" }, el("button", { type: "button", class: "link", onclick: () => openPanel("why") }, "← Back to why this matched")),
    el("h2", { id: "h-panel", tabindex: "-1" }, "Apply: " + job.title),
    el("p", { class: "sub" }, [employerLine(job), job.location].filter(Boolean).join("  ·  ")),
    // Reached from /review the resume is the one the caseworker confirmed there;
    // from the older intake there are no sections, only the drafted text.
    sections ? el("div", { class: "resume-box" }, ResumeTemplate.render(sections, { name: state.name }))
      : resume ? el("pre", { class: "draft-text", lang: "en" }, resume.text)
      : el("p", { class: "empty" }, "No resume for this job: none of the units it asks for is evidenced."),
    el("p", {}, el("b", {}, "The caseworker sends this with the jobseeker's agreement.")),
    el("div", { class: "buttons" },
      el("button", { type: "button", class: "apply", onclick: () => confirmApply(job) }, "Confirm application"),
      el("button", { type: "button", class: "secondary", onclick: () => window.print() }, "Print"),
      el("button", { type: "button", class: "secondary", onclick: () => openPanel("why") }, "Cancel")),
    el("p", { class: "small muted" }, "Demo: recorded in this browser tab only. Nothing is sent to an employer, by email or to Adzuna.")];
}

// ---------------------------------------------------------------- render
function render() {
  const board = boardJobs(state.match);
  const matched = board.filter(job => job.matched.length > 0).length;
  const listed = listedJobs(state.match);
  const selectedId = selectedJobId(listed);
  const selected = listed.find(job => job.id === selectedId) || null;
  $("title").textContent = state.name ? "Matched jobs for " + state.name : "Matched jobs";
  $("summary").textContent = matched + " matching roles in Sydney";
  $("jobs").replaceChildren(...(listed.length ? listed.map(job => renderJobCard(job, job.id === selectedId))
    : [el("p", { class: "empty" }, state.q ? "No role matches this search." : "No role has a unit evidenced yet.")]));
  $("show-all").textContent = state.showAll ? "Show matching roles only" : "Show all " + board.length + " roles";
  const panel = state.panel === "apply" && selected ? renderApply(selected) : renderWhy(selected);
  $("panel").replaceChildren(...el("div", {}, panel).childNodes);
}

// ---------------------------------------------------------------- wiring
$("mock-banner").hidden = !(params.get("mock") === "1" || (session && session.mock)) || QUIET;
$("home").href = asRoute("/", "home.html");
$("nothing-link").href = asRoute("/start/path", "path.html");

if (!session) {
  // Nothing built in this tab: say so and point back, instead of an empty board.
  $("board-view").remove();
  $("nothing").hidden = false;
} else {
  state.applied = readApplied();
  $("job-search").addEventListener("input", event => { state.q = event.target.value; render(); });
  $("show-all").addEventListener("click", () => { state.showAll = !state.showAll; render(); });
  document.addEventListener("keydown", event => { if (event.key === "Escape" && state.panel !== "why") openPanel("why"); });
  render();
}
</script>
</body>
